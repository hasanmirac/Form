<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Form CAPTCHA</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <h2>Formu Görüntülemek İçin CAPTCHA'yı Doğrulayın</h2>
    <form id="captcha-form" action="https://docs.google.com/forms/d/e/1FAIpQLScjFzt2y-P6NvnvlebFSTM5-QFqo7kvzXSa41JnDHch2EpS_A/viewform" method="GET">
        <div class="g-recaptcha" data-sitekey="6LfkWbYqAAAAAGQywV6zc7pfslowVmSkuDWg4vmN"></div>
        <br>
        <button type="submit">Devam Et</button>
    </form>

    <script>
        // Form gönderilmeden önce reCAPTCHA doğrulamasını kontrol et
        document.getElementById('captcha-form').addEventListener('submit', function(event) {
            if (grecaptcha.getResponse() === '') {
                event.preventDefault(); // Form gönderimini engelle
                alert('Lütfen CAPTCHA doğrulamasını tamamlayın.');
            }
        });
    </script>
</body>
</html>
